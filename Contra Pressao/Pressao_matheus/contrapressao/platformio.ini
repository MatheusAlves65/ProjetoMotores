[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; salva tudo o que aparece no Monitor Serial em logs/ (para o grafico_telemetria.py)
; send_on_enter: junta o que você digita e só envia ao apertar Enter
monitor_filters = default, send_on_enter, log2file
; mostra na tela o que você digita
monitor_echo = yes
monitor_eol = LF
; para medir a bateria sem editar o config.h, descomente:
; build_flags = -DUSAR_VBAT_MEDIDA=1